# Publishes the site to GitHub Pages on every push to main.
#
# `configure-pages` with `enablement: true` switches Pages on for the
# repository if it is not already on, so the site goes live without anyone
# opening Settings. The site is static — there is no build step, the repository
# root is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure Pages, enabling it if it is off
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the repository root
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
